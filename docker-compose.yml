services:
  postgres:
    image: postgres:16
    container_name: voltmarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: voltmarket_db
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - voltmarket_pgdata:/var/lib/postgresql/data

volumes:
  voltmarket_pgdata:

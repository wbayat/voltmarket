services:
  postgres:
    image: postgres:16
    container_name: voltmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: voltmart_db
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - voltmart_pgdata:/var/lib/postgresql/data

volumes:
  voltmart_pgdata:

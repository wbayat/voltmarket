<!doctype html>
<html>
  <head>
    <title>Register</title>
  </head>
  <body>
    <nav>
      <a href="index.html">Home</a> | <a href="register.html">Register</a> |
      <a href="login.html">Login</a> |
      <a href="vehicles.html">Browse Vehicles</a>
    </nav>

    <hr />
    <h1>Voltmarket</h1>
    <h1>Register Page</h1>

    <form id="registerForm">
      <label>Name:</label><br />
      <input type="text" id="name" required /><br /><br />

      <label>Email:</label><br />
      <input type="email" id="email" required /><br /><br />

      <label>Password:</label><br />
      <input type="password" id="password" required /><br /><br />

      <button type="submit">Register</button>
    </form>

    <p id="message"></p>

    <script>
      document
        .getElementById("registerForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          // get the info from the form
          const name = document.getElementById("name").value;
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          // send a POST request to the register endpoint with the info from earlier
          try {
            const response = await fetch("/api/auth/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name, email, password }),
            });

            const data = await response.json();

            // display the output
            if (response.ok) {
              document.getElementById("message").textContent =
                "Registered successfully! Welcome, " + data.user.name;
            } else {
              document.getElementById("message").textContent =
                "Error: " + data.message;
            }
          } catch (error) {
            document.getElementById("message").textContent =
              "Something went wrong: " + error.message;
          }
        });
    </script>
  </body>
</html>
